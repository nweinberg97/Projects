name: Project screenshots

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these projects (comma-separated), blank for all"
        required: false
  push:
    paths:
      - shots.json
      - .github/scripts/shots.mjs

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.48.2
      - run: npx playwright install --with-deps chromium
      # Context has no public site, so run its landing page here (local mode, no credentials needed).
      - name: Start Context locally
        run: |
          git clone -q --depth 1 https://github.com/nweinberg97/Context.git /tmp/context
          cd /tmp/context
          cp .env.example .env.local
          npm install --no-audit --no-fund
          (npx next dev -p 3000 > /tmp/context.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && break; sleep 3; done
          curl -s -o /dev/null -w "Context landing: %{http_code}\n" http://localhost:3000/ || tail -30 /tmp/context.log
      - run: node .github/scripts/shots.mjs
        env:
          ONLY: ${{ github.event.inputs.only }}
      # Raw screenshots go to a separate "screenshots" branch for review; the live page never uses this branch.
      - name: Save to the screenshots branch
        run: |
          cd shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
